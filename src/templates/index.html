<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Dashboard DAOCS</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #121212; 
            color: white; 
            margin: 0; 
            padding: 20px; 
            transition: background-color 0.3s;
        }
        h1 { text-align: center; color: #00d2ff; }

        /* Cuadrícula Inteligente */
        .grid-camaras {
            display: grid;
            /* Crea columnas automáticas que no midan menos de 400px */
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
            justify-items: center;
        }

        /* Tarjeta de cada cámara */
        .cam-card {
            width: 100%;
            background: #1e1e1e;
            padding: 10px;
            border-radius: 10px;
            box-sizing: border-box;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            text-align: center;
        }
        
        .cam-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0, 210, 255, 0.3); /* Brillo azul al pasar el mouse */
        }

        .cam-card h3 { margin: 0 0 10px 0; font-size: 1.2rem; }
        
        .cam-card img {
            width: 100%;
            height: auto;
            border-radius: 6px;
        }

        /* =========================================
           MODO ENFOQUE (Cuando le das clic)
           ========================================= */
        .cam-card.focus-mode {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            width: 100vw; height: 100vh;
            max-width: none;
            background: rgba(0, 0, 0, 0.95);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 0;
            padding: 0;
        }

        .cam-card.focus-mode img {
            width: auto;
            height: 90vh; /* Ocupa casi toda la pantalla */
            max-width: 100vw;
        }

        /* Ocultar las demás cámaras y el título cuando hay una enfocada */
        body.has-focus .cam-card:not(.focus-mode) { display: none; }
        body.has-focus h1 { display: none; }
    </style>
</head>
<body>

    <h1>Centro de Monitoreo Inteligente</h1>

    <div class="grid-camaras">
        {% for cam in camaras %}
        <div class="cam-card" onclick="toggleFocus(this)">
            <h3>🎥 {{ cam }}</h3>
            <img data-cam="{{ cam }}" src="{{ url_for('video_feed', cam_name=cam) }}" alt="Feed de {{ cam }}">
        </div>
        {% endfor %}
    </div>

    <script>
        function toggleFocus(element) {
            let imgSeleccionada = element.querySelector('img');
            let nombreCamara = imgSeleccionada.getAttribute('data-cam');
            let todasLasTarjetas = document.querySelectorAll('.cam-card');

            if (!element.classList.contains('focus-mode')) {
                // ==========================
                // 1. ENTRAR EN MODO ENFOQUE
                // ==========================
                element.classList.add('focus-mode');
                document.body.classList.add('has-focus');
                element.querySelector('h3').innerHTML += " <span style='color:red; font-size:0.9rem;'>(Clic para cerrar)</span>";

                // Subir la calidad de la cámara seleccionada
                imgSeleccionada.src = `/video_feed/${nombreCamara}?hq=true`;

                // Apagar (cortar transmisión) de las demás cámaras para liberar la red
                todasLasTarjetas.forEach(tarjeta => {
                    if (tarjeta !== element) {
                        tarjeta.querySelector('img').src = ""; 
                    }
                });

            } else {
                // ==========================
                // 2. SALIR DEL MODO ENFOQUE
                // ==========================
                element.classList.remove('focus-mode');
                document.body.classList.remove('has-focus');
                
                let title = element.querySelector('h3');
                title.innerHTML = "🎥 " + title.innerText.replace(" (Clic para cerrar)", "").replace("🎥 ", "");

                // Restaurar TODAS las cámaras a calidad estándar
                todasLasTarjetas.forEach(tarjeta => {
                    let img = tarjeta.querySelector('img');
                    let camName = img.getAttribute('data-cam');
                    img.src = `/video_feed/${camName}`;
                });
            }
        }
    </script>
</body>
</html>
