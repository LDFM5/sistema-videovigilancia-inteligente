<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Dashboard DAOCS</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #121212; 
            color: white; 
            margin: 0; 
            padding: 20px; 
            transition: background-color 0.3s;
        }
        h1 { text-align: center; color: #00d2ff; }

        /* Cuadrícula Inteligente */
        .grid-camaras {
            display: grid;
            /* Crea columnas automáticas que no midan menos de 400px */
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
            justify-items: center;
        }

        /* Tarjeta de cada cámara */
        .cam-card {
            width: 100%;
            background: #1e1e1e;
            padding: 10px;
            border-radius: 10px;
            box-sizing: border-box;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            text-align: center;
        }
        
        .cam-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0, 210, 255, 0.3); /* Brillo azul al pasar el mouse */
        }

        .cam-card h3 { margin: 0 0 10px 0; font-size: 1.2rem; }
        
        .cam-card img {
            width: 100%;
            height: auto;
            border-radius: 6px;
        }

        /* =========================================
           MODO ENFOQUE (Cuando le das clic)
           ========================================= */
        .cam-card.focus-mode {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            width: 100vw; height: 100vh;
            max-width: none;
            background: rgba(0, 0, 0, 0.95);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 0;
            padding: 0;
        }

        .cam-card.focus-mode img {
            width: auto;
            height: 90vh; /* Ocupa casi toda la pantalla */
            max-width: 100vw;
        }

        /* Ocultar las demás cámaras y el título cuando hay una enfocada */
        body.has-focus .cam-card:not(.focus-mode) { display: none; }
        body.has-focus h1 { display: none; }
    </style>
</head>
<body>

    <h1>Centro de Monitoreo Inteligente</h1>

    <div class="grid-camaras">
        {% for cam in camaras %}
        <div class="cam-card" onclick="toggleFocus(this)">
            <h3>🎥 {{ cam }}</h3>
            <iframe 
                data-cam="{{ cam }}"
                frameborder="0" 
                scrolling="no" 
                style="width: 100%; height: 360px; border-radius: 6px; pointer-events: none;">
            </iframe>
        </div>
        {% endfor %}
    </div>

    <script>
        // 1. INICIALIZAR CÁMARAS CON LA IP REAL DE LA RED
        const ipServidor = window.location.hostname; // Detecta si es localhost o 192.168.x.x
        document.querySelectorAll('.cam-card iframe').forEach(ifr => {
            let camName = ifr.getAttribute('data-cam');
            let urlBase = `http://${ipServidor}:8889/${camName}/`;
            ifr.dataset.baseurl = urlBase;
            ifr.src = urlBase; // Arranca el video
        });

        // 2. LÓGICA DE ENFOQUE Y RECONEXIÓN
        function toggleFocus(element) {
            let todasLasTarjetas = document.querySelectorAll('.cam-card');

            if (!element.classList.contains('focus-mode')) {
                // ENTRAR A MODO ENFOQUE
                element.classList.add('focus-mode');
                document.body.classList.add('has-focus');
                element.querySelector('h3').innerHTML += " <span class='txt-cerrar' style='color:red; font-size:0.9rem;'>(Clic para cerrar)</span>";

                // Apagar las demás cámaras
                todasLasTarjetas.forEach(tarjeta => {
                    if (tarjeta !== element) {
                        tarjeta.querySelector('iframe').src = ""; 
                    }
                });

            } else {
                // SALIR DEL MODO ENFOQUE
                element.classList.remove('focus-mode');
                document.body.classList.remove('has-focus');
                let txtCerrar = element.querySelector('.txt-cerrar');
                if (txtCerrar) txtCerrar.remove();

                // Encender las demás cámaras forzando recarga (Cache-Busting)
                let tiempoActual = new Date().getTime();
                todasLasTarjetas.forEach(tarjeta => {
                    let ifr = tarjeta.querySelector('iframe');
                    // Solo recargamos las que estaban apagadas
                    if (ifr.src === "" || ifr.src.endsWith('blank') || ifr.src === window.location.href) {
                        // Le agregamos ?t=12345 a la URL. El navegador cree que es una página nueva y reinicia WebRTC.
                        ifr.src = ifr.dataset.baseurl + "?t=" + tiempoActual; 
                    }
                });
            }
        }
    </script>
</body>
</html>
