<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <title>Dashboard DAOCS</title>

    <style>

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: white;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #00d2ff;
        }

        /* =========================================
           GRID
        ========================================= */

        .grid-camaras {

            display: grid;

            grid-template-columns:
                repeat(auto-fit, minmax(400px, 1fr));

            gap: 20px;
        }

        /* =========================================
           TARJETAS
        ========================================= */

        .cam-card {

            background: #1e1e1e;

            border-radius: 10px;

            overflow: hidden;

            cursor: pointer;

            transition: all 0.25s ease;

            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .cam-card:hover {

            transform: translateY(-3px);

            box-shadow:
                0 8px 20px rgba(0, 210, 255, 0.25);
        }

        .cam-title {

            padding: 10px;

            text-align: center;

            font-size: 1.1rem;

            background: #151515;
        }

        /* =========================================
           VIDEO
        ========================================= */

        video {

            width: 100%;

            height: auto;

            display: block;

            background: black;
        }

        /* =========================================
        FOCUS MODE
        ========================================= */

        .cam-card.focus-mode {

            position: fixed;

            top: 0;
            left: 0;
            right: 0;
            bottom: 0;

            width: 100vw;
            height: 100vh;

            background: rgba(0,0,0,0.96);

            z-index: 9999;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            border-radius: 0;
        }

        .cam-card.focus-mode iframe {

            width: 95vw;
            height: 90vh;
        }

        /* Ocultar demás */

        body.has-focus .cam-card:not(.focus-mode) {

            display: none;
        }

        body.has-focus h1 {

            display: none;
        }

        /* =========================================
           MÓVIL
        ========================================= */

        @media (max-width: 768px) {

            .grid-camaras {

                grid-template-columns: 1fr;
            }

            .focus-mode video {

                width: 100vw;
                height: auto;
            }
        }

    </style>

</head>

<body>

    <h1>Centro de Monitoreo Inteligente</h1>

    <div class="grid-camaras">

        {% for cam in camaras %}

        <div class="cam-card"
            onclick="toggleFocus(this)">

            <h3>🎥 {{ cam }}</h3>

            <iframe
                data-cam="{{ cam }}"
                loading="lazy"
                allow="autoplay"
                frameborder="0"
                scrolling="no"
                style="
                    width:100%;
                    height:360px;
                    border-radius:6px;
                    background:black;
                    overflow:hidden;
                ">
            </iframe>

        </div>

        {% endfor %}

    </div>

    <script>

        const ipServidor = window.location.hostname;

        // ==========================================
        // INICIAR STREAMS
        // ==========================================
        document.querySelectorAll("iframe").forEach(ifr => {

            const camName = ifr.dataset.cam;

            const url =
                `http://${ipServidor}:8889/${camName}/`;

            ifr.dataset.baseurl = url;

            ifr.src = url;
        });

        // ==========================================
        // TOGGLE FOCUS
        // ==========================================
        function toggleFocus(element) {

            const cards =
                document.querySelectorAll(".cam-card");

            // ======================================
            // ENTRAR MODO FOCUS
            // ======================================
            if (!element.classList.contains("focus-mode")) {

                element.classList.add("focus-mode");

                document.body.classList.add("has-focus");

                // Texto cerrar
                element.querySelector("h3").innerHTML +=
                    " <span class='txt-cerrar' style='color:red;font-size:0.9rem;'>(clic para cerrar)</span>";

                // Apagar otras cámaras
                cards.forEach(card => {

                    if (card !== element) {

                        const ifr =
                            card.querySelector("iframe");

                        ifr.src = "about:blank";
                    }
                });
            }

            // ======================================
            // SALIR MODO FOCUS
            // ======================================
            else {

                element.classList.remove("focus-mode");

                document.body.classList.remove("has-focus");

                // Quitar texto
                const txt =
                    element.querySelector(".txt-cerrar");

                if (txt) txt.remove();

                // Reactivar streams
                cards.forEach(card => {

                    const ifr =
                        card.querySelector("iframe");

                    if (
                        ifr.src.includes("about:blank")
                    ) {

                        ifr.src =
                            ifr.dataset.baseurl +
                            "?t=" + Date.now();
                    }
                });
            }
        }

    </script>
</body>
</html>
